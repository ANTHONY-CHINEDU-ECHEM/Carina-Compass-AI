# Full stack: API, Qdrant, Redis, clinician interface, Prometheus, Grafana and
# an optional local model through Ollama (start it with: docker compose --profile local up).
name: carina-compass

services:
  api:
    build: .
    env_file: .env
    environment:
      CC_VECTOR_BACKEND: qdrant
      CC_QDRANT_URL: http://qdrant:6333
      CC_CACHE_BACKEND: redis
      CC_REDIS_URL: redis://redis:6379/0
      CC_OLLAMA_URL: http://ollama:11434
    volumes:
      - carina-data:/app/data
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on: [api]
    ports:
      - "8080:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    depends_on: [api]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]

  ollama:
    image: ollama/ollama:0.4.7
    profiles: ["local"]
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  carina-data:
  qdrant-data:
  ollama-data:
