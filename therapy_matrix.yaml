# Biomarker and setting matched systemic treatment options for lung cancer.
#
# Every option names the NICE technology appraisal (TA) or NICE guideline
# recommendation that governs NHS use in England. TA numbers and titles were
# checked against the NICE lung cancer product listing and NICE NG122 (last
# updated 8 March 2024, with links to newer appraisals added February 2026).
#
# nice_status values
#   recommended       routinely commissioned option in England for the population described
#   recommended_cdf   available through the Cancer Drugs Fund
#   not_recommended   NICE does not recommend it for this population
#   terminated        NICE terminated the appraisal, so there is no recommendation
#   see_appraisal     consult the appraisal for the exact recommendation and restrictions
#
# This file lists options, never doses. Doses come from the SmPC and the local
# SACT protocol. A clinician must review every change and update last_reviewed.
version: 3
last_reviewed: "2026-10-29"
review_status: "pending clinical review"
verified_against:
  - "NICE lung cancer products listing (technology appraisals)"
  - "NICE NG122 Lung cancer: diagnosis and management"

options:
  # Early stage and locally advanced NSCLC
  - id: neoadj_nivolumab_chemo
    setting: neoadjuvant
    histology: nsclc
    biomarkers_excluded: [EGFR_COMMON, ALK]
    regimen: "Nivolumab with platinum based chemotherapy before surgery"
    drugs: [nivolumab, carboplatin, cisplatin]
    nice: {reference: TA876, status: recommended}
    guideline: "NG122 recommendation 1.6.8"
    evidence: {trial: "CheckMate 816", pmid: "35403841"}
    notes: "Resectable NSCLC; discuss at the thoracic MDT with a thoracic surgeon and oncologist."

  - id: periop_durvalumab_chemo
    setting: perioperative
    histology: nsclc
    biomarkers_excluded: [EGFR_COMMON, ALK]
    regimen: "Durvalumab with platinum based chemotherapy before surgery, then durvalumab alone after surgery"
    drugs: [durvalumab, carboplatin, cisplatin]
    nice: {reference: TA1030, status: recommended}
    guideline: "NG122 recommendation 1.6.9"
    notes: "Resectable NSCLC without EGFR or ALK alterations."

  - id: periop_pembrolizumab_chemo
    setting: perioperative
    histology: nsclc
    regimen: "Pembrolizumab with platinum based chemotherapy before surgery, then pembrolizumab alone after surgery"
    drugs: [pembrolizumab, cisplatin]
    nice: {reference: TA1017, status: recommended}
    guideline: "NG122 recommendation 1.6.10"
    notes: "Resectable NSCLC at high risk of recurrence."

  - id: adjuvant_platinum
    setting: adjuvant
    histology: nsclc
    ps_max: 1
    regimen: "Platinum based combination chemotherapy after complete resection"
    drugs: [cisplatin, vinorelbine]
    guideline: "NG122 recommendations 1.6.11 to 1.6.13"
    nice: {reference: NG122, status: recommended}
    notes: "Offer for WHO performance status 0 to 1 with T1a to T4, N1 to N2, M0 disease; consider for T2b to T4, N0, M0 tumours larger than 4 cm."

  - id: adjuvant_osimertinib
    setting: adjuvant
    histology: nsclc
    biomarkers_any: [EGFR_COMMON]
    regimen: "Osimertinib after complete resection, stopped at 3 years"
    drugs: [osimertinib]
    nice: {reference: TA1043, status: recommended}
    guideline: "NG122 recommendation 1.6.14"
    evidence: {trial: "ADAURA", pmid: "32955177"}
    notes: "Completely resected stage IB to IIIA disease with EGFR exon 19 deletion or exon 21 L858R substitution. Replaces TA761."

  - id: adjuvant_alectinib
    setting: adjuvant
    histology: nsclc
    biomarkers_any: [ALK]
    regimen: "Alectinib after complete resection"
    drugs: [alectinib]
    nice: {reference: TA1014, status: recommended}
    guideline: "NG122 recommendation 1.6.15"
    evidence: {trial: "ALINA", pmid: "38598794"}
    notes: "ALK positive, completely resected stage IB (tumour at least 4 cm) to IIIA disease."

  - id: adjuvant_immunotherapy
    setting: adjuvant
    histology: nsclc
    biomarkers_excluded: [EGFR_COMMON, ALK]
    regimen: "Atezolizumab or pembrolizumab after resection and adjuvant chemotherapy in defined high risk groups"
    drugs: [atezolizumab, pembrolizumab]
    nice: {reference: "TA1071 and TA1037", status: see_appraisal}
    guideline: "NG122 recommendation 1.6.16"
    evidence: {trial: "IMpower010", pmid: "34555333"}
    notes: "Each appraisal restricts use by stage and PD L1 status; check the eligible population."

  - id: consolidation_durvalumab
    setting: consolidation_after_crt
    histology: nsclc
    pdl1_min: 1
    regimen: "Durvalumab maintenance after platinum based chemoradiotherapy without progression"
    drugs: [durvalumab]
    nice: {reference: TA798, status: recommended}
    guideline: "NG122 recommendation 1.6.18"
    notes: "Unresectable stage III NSCLC with PD L1 expression on at least 1% of tumour cells."

  - id: stage3_chemoradiotherapy
    setting: unresectable_stage3
    histology: nsclc
    regimen: "Concurrent platinum based chemoradiotherapy"
    drugs: [cisplatin, carboplatin]
    nice: {reference: NG122, status: recommended}
    guideline: "NG122 recommendation 1.6.17"
    notes: "Consider for stage II to III disease unsuitable for surgery, balancing survival benefit against toxicity."

